var K = 'nu-abelab-pw';
function u8(b) { return Uint8Array.from(atob(b), function (c) { return c.charCodeAt(0); }); }
function open_(pw) {
  var enc = new TextEncoder();
  return crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveKey']).then(function (b) {
    return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: u8(D.s), iterations: D.n, hash: 'SHA-256' }, b,
      { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  }).then(function (k) {
    return crypto.subtle.decrypt({ name: 'AES-GCM', iv: u8(D.i) }, k, u8(D.c));
  }).then(function (buf) {
    return new TextDecoder().decode(buf);
  });
}
function show(html) { document.open(); document.write(html); document.close(); }
function get(s) { try { return s.getItem(K); } catch (e) { return null; } }
function put(s, v) { try { s.setItem(K, v); } catch (e) {} }
function drop() { try { sessionStorage.removeItem(K); localStorage.removeItem(K); } catch (e) {} }
var saved = get(sessionStorage) || get(localStorage);
if (saved) open_(saved).then(show, drop);
document.getElementById('f').addEventListener('submit', function (ev) {
  ev.preventDefault();
  var pw = document.getElementById('pw').value, btn = document.getElementById('go'), err = document.getElementById('err');
  btn.disabled = true; err.textContent = '';
  open_(pw).then(function (html) {
    put(sessionStorage, pw);
    if (document.getElementById('keep').checked) put(localStorage, pw);
    show(html);
  }, function () {
    btn.disabled = false; err.textContent = 'パスワードが違います。';
  });
});
