<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <title>NU-SORA</title>
  <!-- 流れる火球: 夜空を火球が 3.6 秒ごとに横切り、屋上局は 2.4 秒ごとに波面を出す。
       火球の動きは -0.9s から始め、動かない表示（多くのブラウザのファビコン）でも火球が空に見えるようにする -->
  <defs>
    <radialGradient id="ember" cx=".5" cy="1" r="1"><stop offset="0" stop-color="#3A1226"/><stop offset="1" stop-color="#12151A"/></radialGradient>
    <linearGradient id="tail" gradientUnits="userSpaceOnUse" x1="-15" y1="-7.5" x2="0" y2="0">
      <stop offset="0" stop-color="#FF8FA6" stop-opacity="0"/><stop offset="1" stop-color="#FFE3E9"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation=".9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="sky"><path d="M7 0 H25 A7 7 0 0 1 32 7 V23 H0 V7 A7 7 0 0 1 7 0 Z"/></clipPath>
  </defs>
  <rect width="32" height="32" rx="7" fill="url(#ember)"/>
  <g fill="#EDEFF2" opacity=".6"><circle cx="25.5" cy="4.5" r=".6"/><circle cx="28.5" cy="10" r=".5"/><circle cx="8.5" cy="14" r=".5"/><circle cx="13" cy="3" r=".45"/></g>
  <path d="M4 23 H28" stroke="#FF8FA6" stroke-width=".8" opacity=".35"/>
  <g fill="none" stroke="#FF5277" stroke-linecap="round" filter="url(#glow)">
    <path d="M11 23 A5 5 0 0 1 21 23" stroke-width="1.9"/>
    <path d="M7 23 A9 9 0 0 1 25 23" stroke-width="1.5" opacity=".6"/>
    <path d="M3 23 A13 13 0 0 1 29 23" stroke-width="1.2" opacity=".3"/>
  </g>
  <circle cx="16" cy="23" r="3" fill="none" stroke="#FF8FA6" stroke-width="1.1" clip-path="url(#sky)">
    <animate attributeName="r" values="3;17" dur="2.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <g clip-path="url(#sky)">
    <g transform="translate(19.6 10.8)">
      <animateTransform attributeName="transform" type="translate" values="2 2;26 14;26 14" keyTimes="0;.34;1" dur="3.6s" begin="-0.9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;.04;.28;.34;1" dur="3.6s" begin="-0.9s" repeatCount="indefinite"/>
      <path d="M-15 -7.5 L-0.45 0.89 L0.45 -0.89 Z" fill="url(#tail)"/>
      <circle r="2.6" fill="#FF5277" opacity=".5" filter="url(#glow)"/>
      <circle r="1.4" fill="#fff"/>
    </g>
  </g>
  <circle cx="16" cy="23" r="1.8" fill="#fff" filter="url(#glow)"/>
</svg>
